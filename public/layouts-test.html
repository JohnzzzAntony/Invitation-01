<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Layout QA harness — internal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500&family=Baloo+2:wght@500;600;700&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&family=Lato:wght@300;400;700&family=Parisienne&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/mu.css" />
  <link rel="stylesheet" href="css/mu-extra.css" />
  <style>
    body { background: #e8ecef; margin: 0; padding: 24px; font-family: Lato, sans-serif; }
    .qa-note { font: 14px/1.5 Lato, sans-serif; color: #45525c; max-width: 900px; margin: 0 auto 8px; }
    .qa-row { padding: 24px 0; border-bottom: 1px dashed #b9c4cb; }
    .qa-full { max-width: 1280px; margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,.12); }
    .qa-minis { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin: 20px auto; max-width: 1280px; }
    .qa-mini { width: 260px; flex: none; }
    h2.qa-h { font: 600 20px Lato, sans-serif; color: #12303a; text-align: center; margin: 32px 0 4px; }
    .qa-err { color: #a3271f; font: 13px/1.5 monospace; white-space: pre-wrap; background: #fff; padding: 12px; }
  </style>
</head>
<body>
  <p class="qa-note">Internal QA harness — renders every registered layout in full, plus a mini for each of its
    themes. Not linked from the site; noindex. Add <code>?layout=&lt;id&gt;</code> to render one layout only.</p>
  <div id="qa-root"></div>

  <script src="js/templates.js"></script>
  <script src="js/mu.js"></script>
  <script src="js/layouts/poetic.js"></script>
  <script src="js/layouts/herald.js"></script>
  <script src="js/layouts/atrium.js"></script>
  <script src="js/layouts/editorial.js"></script>
  <script src="js/layouts/calm.js"></script>
  <script src="js/layouts/terra.js"></script>
  <script src="js/layouts/serene.js"></script>
  <script src="js/layouts/mandala.js"></script>
  <script src="js/layouts/crescent.js"></script>
  <script src="js/layouts/heritage.js"></script>
  <script>
    (function () {
      var root = document.getElementById('qa-root');
      var only = new URLSearchParams(location.search).get('layout');
      var layouts = window.EVER_layouts().filter(function (l) { return !only || l.id === only; });
      var live = [];

      layouts.forEach(function (ly) {
        var h = document.createElement('h2');
        h.className = 'qa-h';
        h.textContent = ly.id + ' — ' + ly.label;
        root.appendChild(h);

        var themes = window.EVER_THEMES.filter(function (t) { return t.layout === ly.id; });
        var row = document.createElement('div');
        row.className = 'qa-row';
        root.appendChild(row);

        try {
          var data = window.EVER_siteDefaults(themes[0].id);
          var full = document.createElement('div');
          full.className = 'qa-full';
          var site = window.EVER_renderSite(data, { interactive: true });
          site.__wsData = data;
          full.appendChild(site);
          row.appendChild(full);
          window.EVER_bindSite(site);
          live.push(site);
        } catch (err) {
          var e = document.createElement('pre');
          e.className = 'qa-err';
          e.textContent = 'render failed: ' + (err && err.stack || err);
          row.appendChild(e);
        }

        var minis = document.createElement('div');
        minis.className = 'qa-minis';
        themes.forEach(function (t) {
          var cell = document.createElement('div');
          cell.className = 'qa-mini';
          try {
            cell.appendChild(window.EVER_renderSiteMini(t, null, {}));
          } catch (err2) {
            cell.innerHTML = '<pre class="qa-err">' + (err2 && err2.message) + '</pre>';
          }
          var cap = document.createElement('p');
          cap.className = 'qa-note';
          cap.textContent = t.name + ' · ' + t.event;
          cell.appendChild(cap);
          minis.appendChild(cell);
        });
        row.appendChild(minis);
      });

      setInterval(function () {
        live.forEach(function (s) { window.EVER_tickCountdowns(s); });
      }, 1000);
      live.forEach(function (s) { window.EVER_tickCountdowns(s); });

      if (!layouts.length) {
        root.innerHTML = '<p class="qa-note">No layouts registered — check the script paths.</p>';
      }
    })();
  </script>
</body>
</html>
