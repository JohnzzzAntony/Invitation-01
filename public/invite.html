<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're invited</title>
  <meta name="description" content="You have been invited — see the details and RSVP." />
  <!-- Guests' invitations are private: never indexed. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1798b8" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231798b8'/%3E%3Ctext x='16' y='21.5' font-family='Georgia,serif' font-size='15' fill='white' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/commerce.css" />
  <link rel="stylesheet" href="css/mu.css" />
  <link rel="stylesheet" href="css/mu-extra.css" />
</head>
<body class="invite-body">
  <!-- The published invitation renders here, full-bleed. -->
  <div id="invite-root"></div>

  <div class="invite-missing" id="invite-missing" hidden>
    <div class="container">
      <h1>This invitation could not be opened</h1>
      <p>
        The link may be incomplete — invitation links are long, so they can get
        cut short when copied out of a message. Ask whoever invited you to send
        the full link again.
      </p>
      <a class="btn btn-primary" href="index.html">About Invitara</a>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/templates.js"></script>
  <script src="js/mu.js"></script>
  <script src="js/layouts/poetic.js"></script>
  <script src="js/layouts/herald.js"></script>
  <script src="js/layouts/atrium.js"></script>
  <script src="js/layouts/editorial.js"></script>
  <script src="js/layouts/calm.js"></script>
  <script src="js/layouts/terra.js"></script>
  <script src="js/layouts/serene.js"></script>
  <script src="js/layouts/mandala.js"></script>
  <script src="js/layouts/crescent.js"></script>
  <script src="js/layouts/heritage.js"></script>
  <script src="js/commerce.js"></script>
  <script src="js/invite.js"></script>
</body>
</html>
